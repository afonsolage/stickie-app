[package]
name = "stickie"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Lightweight in-game overlay for notes, stickies and screenshots"
license = "MIT OR Apache-2.0"
repository = "https://github.com/afonsolage/stickie-app"
homepage = "https://github.com/afonsolage/stickie-app"
keywords = ["bevy", "overlay", "notes", "gaming", "egui"]
categories = ["games", "gui"]

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "multi_threaded",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "png",
    "x11",
    "wayland",
] }
bevy_egui = { version = "0.43.1", default-features = false, features = [
    "render",
    "default_fonts",
    "manage_clipboard",
    "open_url",
] }
egui_commonmark = "0.25"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"
directories = "6"

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
xcap = "0.9"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
